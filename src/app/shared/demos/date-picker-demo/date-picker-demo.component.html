<div class="w-full max-w-sm">

  <!-- Controls -->
  <div class="mb-3 grid gap-3 rounded-xl border border-slate-200 bg-slate-50 p-3 dark:border-white/10 dark:bg-white/[0.03]">
    <div role="group" aria-label="Selection mode">
      <span class="text-[0.7rem] font-semibold uppercase tracking-wide text-slate-500 dark:text-gray-500">Mode</span>
      <div class="mt-1.5 flex flex-wrap gap-1">
        @for (item of modes; track item) {
          <button type="button" (click)="setMode(item)" [attr.aria-pressed]="mode() === item"
            [class]="chip(mode() === item)">{{ item }}</button>
        }
      </div>
    </div>

    <div role="group" aria-label="Output format">
      <span class="text-[0.7rem] font-semibold uppercase tracking-wide text-slate-500 dark:text-gray-500">Format</span>
      <div class="mt-1.5 flex flex-wrap gap-1">
        @for (item of formats; track item.id) {
          <button type="button" (click)="format.set(item.id)" [attr.aria-pressed]="format() === item.id"
            [class]="chip(format() === item.id) + ' normal-case'">{{ item.label }}</button>
        }
      </div>
    </div>

    <label class="flex cursor-pointer items-center gap-2 text-xs text-slate-600 dark:text-gray-400">
      <input type="checkbox" [checked]="showTime()" (change)="showTime.set($any($event.target).checked)"
        class="h-3.5 w-3.5 accent-red-600" />
      Include time
    </label>
  </div>

  <!-- Calendar: the library component, driven by the controls above. -->
  <hk-date-picker
    [(value)]="value"
    [(rangeEnd)]="rangeEnd"
    [mode]="mode()"
    [format]="format()"
    [showTime]="showTime()"
    (dateChange)="emitted.set($event)" />

  <!-- Output: whatever the caller would actually receive. -->
  <div class="mt-3 rounded-xl border border-slate-200 bg-white p-3 dark:border-white/10 dark:bg-neutral-950">
    <p class="text-[0.7rem] font-semibold uppercase tracking-wide text-slate-500 dark:text-gray-500">
      (dateChange) emits
    </p>
    <p class="mt-1 break-all font-mono text-xs text-red-600 dark:text-red-400">{{ output() }}</p>
  </div>
</div>
