<div class="w-full max-w-xl">

  <!-- Variant picker -->
  <div class="mb-6 flex flex-wrap gap-1.5" role="group" aria-label="Stepper variant">
    @for (item of variants; track item.id) {
      <button type="button" (click)="variant.set(item.id)" [attr.aria-pressed]="variant() === item.id"
        [class]="chip(variant() === item.id)">{{ item.label }}</button>
    }
  </div>

  <hk-stepper #stepper [variant]="variant()" [(step)]="step">
    @for (item of steps; track item.label) {
      <hk-step [label]="item.label" [detail]="item.detail" />
    }
  </hk-stepper>

  <div class="mt-8 flex justify-center gap-3">
    <button type="button" (click)="stepper.prev()" [disabled]="step() === 0"
      class="cursor-pointer rounded-lg border border-slate-200 dark:border-white/10 px-5 py-2 text-xs font-semibold text-slate-600 dark:text-gray-400 transition
             hover:text-slate-900 dark:hover:text-white disabled:cursor-not-allowed disabled:opacity-30">
      Back
    </button>
    <button type="button" (click)="stepper.next()" [disabled]="step() === steps.length - 1"
      class="cursor-pointer rounded-lg bg-gradient-to-r from-red-600 to-red-800 px-5 py-2 text-xs font-semibold text-white
             transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-30">
      Next
    </button>
  </div>
</div>
