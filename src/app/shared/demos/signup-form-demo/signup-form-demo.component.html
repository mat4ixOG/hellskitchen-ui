<div class="w-full max-w-md">

  @if (done()) {
    <!-- Success is a state of the same card, not a redirect: nothing is lost
         if the user wants to go back. -->
    <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-8 text-center dark:border-emerald-800/50 dark:bg-emerald-950/30">
      <div class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-emerald-600 text-white">
        <i class="pi pi-check text-lg"></i>
      </div>
      <h3 class="mt-4 text-base font-bold text-slate-900 dark:text-white">You're in</h3>
      <p class="mt-1 text-xs leading-relaxed text-slate-600 dark:text-gray-400">
        @if (sso()) {
          Signed up with <b class="text-slate-900 dark:text-white">{{ sso() }}</b>. No password to remember.
        } @else {
          We sent a confirmation to <b class="text-slate-900 dark:text-white">{{ email() }}</b>.
        }
      </p>
      <button type="button" (click)="reset()"
        class="mt-5 rounded-lg border border-emerald-300 px-4 py-2 text-xs font-semibold text-emerald-800 transition hover:bg-emerald-100 dark:border-emerald-700/60 dark:text-emerald-300 dark:hover:bg-emerald-950/60">
        Start over
      </button>
    </div>
  } @else {
    <hk-signup-form #signup
      [providers]="providers"
      [roles]="roles"
      [minPasswordScore]="5"
      [busy]="busy()"
      (submitted)="register($event)"
      (ssoRequested)="useSso($event)" />

    <p class="mt-3 text-center text-xs text-slate-500 dark:text-gray-500">
      Form status: <code class="text-slate-600 dark:text-gray-400">{{ signup.form.status }}</code>
    </p>
  }
</div>
