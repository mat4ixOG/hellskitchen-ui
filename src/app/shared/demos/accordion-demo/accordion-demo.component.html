<div class="flex w-full max-w-lg flex-col gap-4">
  <!-- Controls -->
  <div class="flex flex-wrap items-center gap-2">
    <span class="text-[0.7rem] font-semibold uppercase tracking-wide text-slate-500 dark:text-gray-500">Mode</span>
    <button type="button" (click)="setMultiple(false)" [attr.aria-pressed]="!multiple()"
      [class]="chip(!multiple())">Single</button>
    <button type="button" (click)="setMultiple(true)" [attr.aria-pressed]="multiple()"
      [class]="chip(multiple())">Multiple</button>

    <span class="ml-auto flex gap-2">
      <button type="button" (click)="expandAll()" [class]="chip(false)">Expand all</button>
      <button type="button" (click)="collapseAll()" [class]="chip(false)">Collapse all</button>
    </span>
  </div>

  <div class="divide-y divide-slate-200 dark:divide-white/5 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.03]">
    @for (panel of panels; track panel.id) {
      <div>
        <h3 class="m-0">
          <button type="button"
            [id]="'hk-acc-header-' + panel.id"
            [attr.aria-expanded]="isOpen(panel.id)"
            [attr.aria-controls]="'hk-acc-panel-' + panel.id"
            [disabled]="panel.disabled"
            (click)="toggle(panel)"
            (keydown)="onKey($event, panel)"
            class="flex w-full items-center justify-between gap-4 px-5 py-4 text-left text-sm font-semibold
                   text-slate-700 dark:text-gray-300 transition hover:text-slate-900 dark:hover:text-white
                   cursor-pointer disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:text-slate-700
                   dark:disabled:hover:text-gray-300
                   focus-visible:outline-2 focus-visible:outline-red-600 focus-visible:-outline-offset-2">
            <span>{{ panel.header }}</span>
            <i class="pi pi-chevron-down text-xs text-red-600 dark:text-red-400 transition-transform duration-300"
              [class]="isOpen(panel.id) ? 'rotate-180' : ''" aria-hidden="true"></i>
          </button>
        </h3>

        <!-- grid-rows animation copes with unknown content height -->
        <div [id]="'hk-acc-panel-' + panel.id" role="region"
          [attr.aria-labelledby]="'hk-acc-header-' + panel.id"
          [attr.inert]="isOpen(panel.id) ? null : ''"
          class="grid overflow-hidden transition-all duration-300 ease-out"
          [class]="isOpen(panel.id) ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'">
          <p class="min-h-0 px-5 pb-4 text-sm leading-relaxed text-slate-600 dark:text-gray-400">{{ panel.body }}</p>
        </div>
      </div>
    }
  </div>
</div>
