<div class="w-full max-w-lg divide-y divide-slate-200 dark:divide-white/5 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[0.03]">
  @for (item of items; track item.q) {
    <div>
      <button type="button" (click)="toggle($index)"
        [attr.aria-expanded]="open() === $index"
        class="flex w-full items-center justify-between gap-4 px-5 py-4 text-left text-sm font-semibold
               text-slate-700 dark:text-gray-300 transition hover:text-slate-900 dark:hover:text-white cursor-pointer">
        {{ item.q }}
        <i class="pi pi-chevron-down text-xs text-red-600 dark:text-red-400 transition-transform duration-300"
          [class]="open() === $index ? 'rotate-180' : ''"></i>
      </button>

      <!-- grid-rows animation copes with unknown content height -->
      <div class="grid overflow-hidden transition-all duration-300 ease-out"
        [class]="open() === $index ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'">
        <p class="min-h-0 px-5 pb-4 text-sm leading-relaxed text-slate-600 dark:text-gray-400">{{ item.a }}</p>
      </div>
    </div>
  }
</div>
