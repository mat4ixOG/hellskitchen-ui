<section id="community" class="relative overflow-hidden bg-white dark:bg-neutral-950 py-28">
  <div aria-hidden="true"
    class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-red-700/50 to-transparent"></div>

  <div class="relative mx-auto max-w-7xl px-6">

    <!-- Stat row -->
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (stat of stats; track stat.label) {
        <div appReveal [revealDelay]="$index * 80"
          class="rounded-2xl border border-slate-200 dark:border-white/10 bg-white/85 dark:bg-black/85 p-7 text-center
                 transition-colors duration-300 hover:border-red-800/50">
          <p class="text-4xl font-black tracking-tight text-slate-900 dark:text-white">
            <span appCountUp
              [countTo]="stat.value"
              [countDecimals]="stat.decimals"
              [countSuffix]="stat.suffix">0</span>
          </p>
          <p class="mt-3 text-sm font-semibold text-red-600 dark:text-red-400">{{ stat.label }}</p>
          <p class="mt-1 text-xs text-slate-500 dark:text-gray-500">{{ stat.note }}</p>
        </div>
      }
    </div>

    <!-- Quotes -->
    <div class="mt-20">
      <h2 appReveal class="text-center text-3xl font-black tracking-tight text-slate-900 dark:text-white sm:text-4xl">
        Built in the open, used in production
      </h2>

      <div class="mt-12 grid gap-5 lg:grid-cols-3">
        @for (quote of quotes; track quote.name) {
          <figure appReveal [revealDelay]="$index * 90"
            class="relative flex h-full flex-col rounded-2xl border border-slate-200 dark:border-white/10 bg-white/85 dark:bg-black/85 p-7">
            <i class="pi pi-comment absolute right-6 top-6 text-2xl text-red-900/60"></i>
            <blockquote class="relative text-sm leading-relaxed text-slate-600 dark:text-gray-400">
              "{{ quote.body }}"
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-3 border-t border-slate-200/60 dark:border-white/5 pt-5">
              <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-red-600 to-red-900
                           text-xs font-bold text-white">
                {{ quote.name.charAt(0) }}
              </span>
              <span>
                <span class="block text-sm font-semibold text-slate-900 dark:text-white">{{ quote.name }}</span>
                <span class="block text-xs text-slate-500 dark:text-gray-500">{{ quote.role }}</span>
              </span>
            </figcaption>
          </figure>
        }
      </div>
    </div>
  </div>
</section>
