<section class="relative overflow-hidden bg-white dark:bg-neutral-950 py-28">
  <div aria-hidden="true" class="absolute inset-0 bg-grid mask-fade opacity-50"></div>
  <div aria-hidden="true"
    class="animate-pulse-glow absolute left-1/2 top-1/2 h-[26rem] w-[46rem] -translate-x-1/2 -translate-y-1/2
           rounded-full bg-red-800/25 blur-[130px]"></div>

  <div class="relative mx-auto max-w-3xl px-6 text-center">
    <h2 appReveal class="text-4xl font-black tracking-tight text-slate-900 dark:text-white sm:text-5xl">
      Take it. It's
      <span class="text-shimmer">yours.</span>
    </h2>

    <p appReveal [revealDelay]="80" class="mx-auto mt-5 max-w-xl text-lg leading-relaxed text-slate-600 dark:text-gray-400">
      One install, no account, no key. Star the repo if it saves you an afternoon —
      that's the whole business model.
    </p>

    <div appReveal [revealDelay]="160"
      class="ring-gradient mx-auto mt-10 flex max-w-md items-center gap-3 rounded-xl bg-slate-50 dark:bg-white/[0.03] px-5 py-4 font-mono text-sm">
      <span class="select-none text-red-600 dark:text-red-400">$</span>
      <code class="flex-1 truncate text-left text-slate-700 dark:text-gray-300">{{ command }}</code>
      <button type="button" (click)="copy()"
        [attr.aria-label]="copied() ? 'Copied' : 'Copy install command'"
        class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-600 dark:text-gray-400 transition
               hover:bg-slate-100 dark:hover:bg-white/5 hover:text-red-700 dark:hover:text-red-400 active:scale-90 cursor-pointer">
        <i [class]="copied() ? 'pi pi-check text-red-600 dark:text-red-400' : 'pi pi-copy'"></i>
      </button>
    </div>

    <div appReveal [revealDelay]="240" class="mt-8 flex flex-wrap items-center justify-center gap-4">
      <a href="#components"
        class="group inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-red-600 to-red-800 px-7 py-3.5
               text-sm font-semibold text-white shadow-lg shadow-red-500/25 transition hover:brightness-110 active:scale-95">
        Read the docs
        <i class="pi pi-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
      </a>
      <a href="https://github.com/mat4ixOG/hellskitchen-ui" target="_blank" rel="noopener noreferrer"
        class="inline-flex items-center gap-2 rounded-xl border border-slate-300 dark:border-white/20 px-7 py-3.5 text-sm font-semibold
               text-slate-700 dark:text-gray-300 transition hover:border-red-400 dark:hover:border-red-600/50 hover:bg-red-50 dark:hover:bg-red-950/30 hover:text-slate-900 dark:hover:text-white">
        <i class="pi pi-github text-base"></i>
        Star on GitHub
      </a>
    </div>
  </div>
</section>
