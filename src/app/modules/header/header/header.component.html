<nav
  class="sticky top-0 z-50 border-b border-red-200 dark:border-red-800/50 bg-white/85 dark:bg-black/85 backdrop-blur-xl transition-shadow duration-300
         before:absolute before:inset-x-0 before:top-0 before:h-px
         before:bg-gradient-to-r before:from-transparent before:via-red-600/70 before:to-transparent"
  [class.shadow-2xl]="scrolled()">

  <div
    class="mx-auto flex max-w-7xl items-center justify-between px-6 transition-all duration-300"
    [class.py-5]="!scrolled()"
    [class.py-3]="scrolled()">

    <!-- Logo -->
    <a href="/" class="group flex shrink-0 items-center gap-3">
      <span
        class="grid h-11 w-11 place-items-center rounded-xl bg-gradient-to-br from-red-600 to-red-900
               shadow-lg shadow-red-500/25 ring-1 ring-red-500/40
               text-white transition-transform duration-300 group-hover:rotate-6 group-hover:scale-105">
        <!-- Daredevil double-D emblem: two back-to-back D letterforms -->
        <svg viewBox="0 0 48 48" class="h-7 w-7" fill="currentColor" fill-rule="evenodd"
             aria-hidden="true">
          <path d="M25 7h5a17 17 0 0 1 0 34h-5zm6 7v20a10 10 0 0 0 0-20z" />
          <path d="M25 7h5a17 17 0 0 1 0 34h-5zm6 7v20a10 10 0 0 0 0-20z"
                transform="translate(48 0) scale(-1 1)" />
        </svg>
      </span>
      <span class="flex flex-col leading-none">
        <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">
          Hell's
          <span class="bg-gradient-to-r from-red-500 to-red-700 bg-clip-text text-transparent">Kitchen</span>
        </span>
        <span class="mt-1 text-[0.65rem] font-medium uppercase tracking-[0.22em] text-slate-500 dark:text-gray-500">
          Angular UI
        </span>
      </span>
    </a>

    <!-- Desktop menu -->
    <ul class="hidden items-center gap-1 text-sm font-medium lg:flex">
      @for (link of links; track link.label) {
        <li>
          <a
            [href]="href(link)"
            (click)="select(link)"
            class="relative rounded-lg px-3.5 py-2 text-slate-600 dark:text-gray-400 transition-colors duration-200
                   hover:bg-red-50 dark:hover:bg-red-950/40 hover:text-red-700 dark:hover:text-red-400
                   after:absolute after:inset-x-3.5 after:-bottom-0.5 after:h-0.5 after:rounded-full
                   after:bg-gradient-to-r after:from-red-600 after:to-red-500
                   after:origin-left after:transition-transform after:duration-300"
            [class]="isActive(link) ? 'text-red-600 dark:text-red-400 after:scale-x-100' : 'after:scale-x-0'">
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- Desktop actions -->
    <div class="hidden items-center gap-2 lg:flex">
      <app-theme-toggle />
      <a href="https://github.com/mat4ixOG/hellskitchen-ui" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository"
        class="grid h-10 w-10 place-items-center rounded-lg border border-slate-200 dark:border-white/10 text-slate-600 dark:text-gray-400
               transition hover:border-red-400 dark:hover:border-red-600/50 hover:text-red-700 dark:hover:text-red-400">
        <i class="pi pi-github"></i>
      </a>
      <a href="/components"
        class="rounded-lg bg-gradient-to-r from-red-600 to-red-900 px-5 py-2.5 text-sm font-semibold text-white
               shadow-lg shadow-red-500/25 transition duration-200 hover:brightness-110 active:scale-95">
        Get started
      </a>
    </div>

    <!-- Mobile actions -->
    <div class="flex items-center gap-1.5 lg:hidden">
      <app-theme-toggle />
    <button
      type="button"
      (click)="toggleMobile()"
      [attr.aria-expanded]="mobileOpen()"
      aria-controls="mobile-menu"
      aria-label="Toggle navigation"
      class="grid h-10 w-10 place-items-center rounded-lg text-slate-900 dark:text-white transition hover:bg-slate-200 dark:hover:bg-white/10 cursor-pointer lg:hidden">
      <i class="text-xl" [class]="mobileOpen() ? 'pi pi-times' : 'pi pi-bars'"></i>
    </button>
    </div>
  </div>

  <!-- Reading progress -->
  <div aria-hidden="true" class="absolute inset-x-0 bottom-0 h-px bg-transparent">
    <div class="h-full bg-gradient-to-r from-red-700 via-red-500 to-red-400 transition-[width] duration-150"
      [style.width.%]="progress()"></div>
  </div>

  <!-- Mobile menu -->
  <div
    id="mobile-menu"
    class="overflow-hidden border-t border-slate-200 dark:border-white/10 transition-[max-height,opacity] duration-300 ease-out lg:hidden"
    [class.max-h-0]="!mobileOpen()"
    [class.opacity-0]="!mobileOpen()"
    [class.max-h-screen]="mobileOpen()"
    [class.opacity-100]="mobileOpen()">

    <ul class="flex flex-col gap-1 px-6 py-4 text-base font-medium">
      @for (link of links; track link.label) {
        <li>
          <a
            [href]="href(link)"
            (click)="select(link)"
            class="flex items-center justify-between rounded-lg px-3 py-3 text-slate-600 dark:text-gray-400 transition
                   hover:bg-red-50 dark:hover:bg-red-950/40 hover:text-red-700 dark:hover:text-red-400"
            [class]="isActive(link) ? 'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/40' : ''">
            {{ link.label }}
            <i class="pi pi-angle-right text-xs opacity-50"></i>
          </a>
        </li>
      }
      <li class="pt-2">
        <a href="/components"
          class="block w-full rounded-lg bg-gradient-to-r from-red-600 to-red-900 px-4 py-3 text-center
                 text-sm font-semibold text-white transition active:scale-95">
          Get started
        </a>
      </li>
    </ul>
  </div>
</nav>
