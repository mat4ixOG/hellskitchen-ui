<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hell's Kitchen</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Runs before the first paint, so the stored theme is already on <html>
    // when the page renders. HkThemeService owns it from then on.
    (function () {
      try {
        var saved = localStorage.getItem('hk-theme');
        var dark = saved ? saved === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
