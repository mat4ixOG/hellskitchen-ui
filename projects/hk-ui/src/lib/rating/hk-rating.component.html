<ng-template #glyph>
  @if (icon()) {
    <i [class]="icon()" aria-hidden="true"></i>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2.5l2.94 5.96 6.56.95-4.75 4.63 1.12 6.54L12 17.5l-5.87 3.08 1.12-6.54L2.5 9.41l6.56-.95z" />
    </svg>
  }
</ng-template>

<div class="hk-rating" role="radiogroup" aria-label="Rating"
  [attr.aria-readonly]="readonly() || null"
  [attr.tabindex]="readonly() ? null : 0"
  (keydown)="onKey($event)"
  (pointerleave)="hovered.set(0)">
  @for (item of items(); track item) {
    <button type="button" role="radio" class="hk-rating-item"
      [class.is-readonly]="readonly()"
      [disabled]="readonly()"
      [attr.aria-checked]="value() === item"
      [attr.aria-label]="item + ' of ' + count()"
      (click)="select(item, $event)"
      (pointermove)="hover(item, $event)">
      <span class="hk-rating-icon" [class.is-on]="fill(item) === 1">
        <ng-container [ngTemplateOutlet]="glyph" />
        @if (fill(item) === 0.5) {
          <span class="hk-rating-half"><ng-container [ngTemplateOutlet]="glyph" /></span>
        }
      </span>
    </button>
  }
</div>
